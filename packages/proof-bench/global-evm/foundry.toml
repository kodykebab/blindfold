[profile.default]
src = "."
test = "."
out = "../results/global-evm-out"
cache_path = "../results/global-evm-cache"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = ["blindfold/=../../../contracts/", "forge-std/=../../../contracts/lib/forge-std/src/", "v4-core/=../../../contracts/lib/v4-core/", "solmate/=../../../contracts/lib/v4-core/lib/solmate/", "global-preparation/=../results/global-preparation/src/", "global-online/=../results/global-online/src/"]
allow_paths = ["../../../contracts", "../results"]
fs_permissions = [{ access = "read", path = "../results" }]
